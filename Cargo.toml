[package]
name = "reel"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "A lightweight Wayland wallpaper daemon with a directory slideshow"
repository = "https://github.com/artemnefedov/reel"
readme = "README.md"
keywords = ["wayland", "wallpaper", "slideshow", "layer-shell"]
categories = ["command-line-utilities", "multimedia::images"]

[dependencies]
fast_image_resize = "6.1.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
memmap2 = "0.9.12"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }

[lints.clippy]
undocumented_unsafe_blocks = "warn"
multiple_unsafe_ops_per_block = "warn"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
